name: One-time sync of verified Nee Android16 APK 40004
'on':
  push:
    paths:
      - '.github/workflows/sync-nee-40004.yml'
permissions:
  contents: write
concurrency:
  group: sync-nee-40004
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact verified APK and update download metadata
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64,bz2,hashlib,io,json,zlib
          from pathlib import Path
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          target=Path(payload['target'])
          old=target.read_bytes()
          def number(data):
              if len(data)!=8:raise ValueError('Truncated delta integer')
              value=int.from_bytes(data,'little') & ((1<<63)-1)
              return -value if data[7]&128 else value
          if hashlib.sha256(old).hexdigest()!=payload['new_sha256']:
              assert hashlib.sha256(old).hexdigest()==payload['base_sha256'],'Base APK differs; refusing to overwrite'
              patch=base64.b64decode(payload['patch'])
              assert patch[:8]==b'BSDIFF40'
              clen,dlen,total=[number(patch[i:i+8]) for i in [8,16,24]]
              assert min(clen,dlen,total)>=0
              control=io.BytesIO(bz2.decompress(patch[32:32+clen]))
              diff=io.BytesIO(bz2.decompress(patch[32+clen:32+clen+dlen]))
              extra=io.BytesIO(bz2.decompress(patch[32+clen+dlen:]))
              result=bytearray(total);op=np=0
              while np<total:
                  x,y,z=[number(control.read(8)) for _ in range(3)]
                  assert x>=0 and y>=0 and np+x+y<=total
                  block=diff.read(x);assert len(block)==x
                  for i,b in enumerate(block):result[np+i]=(b+(old[op+i] if 0<=op+i<len(old) else 0))&255
                  np+=x;op+=x
                  block=extra.read(y);assert len(block)==y
                  result[np:np+y]=block;np+=y;op+=z
              assert hashlib.sha256(result).hexdigest()==payload['new_sha256'],'APK checksum differs'
              target.write_bytes(result)
          for name,text in payload['texts'].items():
              path=Path(name);assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          print('Verified APK SHA-256:',hashlib.sha256(target.read_bytes()).hexdigest())
          PYTHON
      - name: Publish verified APK and metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks/android16/WatchmanNee-Android16.apk README.md catalog.json SHA256SUMS.txt docs/versions.md docs/map-list-fix-40004.md
          if git diff --cached --quiet
          then
            echo 'Verified version 40004 is already synchronized.'
          else
            git commit -m 'Update Watchman Nee Android16 to verified revision 40004'
            git push
          fi
